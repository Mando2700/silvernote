# Wakes SilverNote's scheduler (/api/cron) so data refreshes, alerts fire and briefs are written
# while no browser is open. Vercel Cron on the Hobby plan can only run once a day, so this does the
# frequent ticks. Needs two repository secrets: APP_URL (https://…) and CRON_SECRET.
name: Scheduler

on:
  schedule:
    # Every 15 minutes through the US session (pre-market to after-hours, UTC), weekdays.
    - cron: '*/15 11-23 * * 1-5'
    # Hourly otherwise (weekends: Sunday red team, catch-up jobs).
    - cron: '7 0-10 * * *'
    - cron: '7 11-23 * * 0,6'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call /api/cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL or CRON_SECRET secret missing"; exit 0; fi
          curl -sS --fail-with-body --max-time 320 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron"
