# Netlify hosting (free plan). The Next.js runtime is detected and added automatically.
# Background work runs on GitHub Actions (.github/workflows/worker.yml), not here.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

# Declared explicitly: uploads that aren't built from a linked Git repo don't add it on their own.
[[plugins]]
  package = "@netlify/plugin-nextjs"
